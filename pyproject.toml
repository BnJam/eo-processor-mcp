[build-system]
requires = [
    "hatchling",
    "wheel"
]
build-backend = "hatchling.build"

[project]
name = "eo-processor-mcp"
version = "0.2.0"
description = "An MCP Server for Earth Observation processing powered by eo-processor"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "BnJam"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.0,<4.0.0",
    "pydantic>=2.11.0",
    "eo-processor>=0.23.1",
    "numpy>=1.20.0",
    "xarray>=2023.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.5.0",
    "pytest-cov",
]

[project.scripts]
eo-processor-mcp = "eo_processor_mcp.__main__:main"

[tool.hatch.build]
where = ["."]
include = ["eo_processor_mcp*"]

[tool.ruff]
line-length = 88
target-version = "py312"
lint.select = ["E", "F", "W", "I", "N", "UP", "YTT", "S", "BLE", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
lint.ignore = ["S101", "T201", "PLR0913", "PLR0912", "PLR0915", "COM812", "PLR0917", "A002", "PLC0415", "TRY003", "EM101", "BLE001", "PLR2004", "PTH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
